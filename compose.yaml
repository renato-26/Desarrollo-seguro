name: pnksecurity-${APP_ENV:-dev}
x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-dev}
  NODE_ENV: ${NODE_ENV:-development}
  PORT: "3000"
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-pnk_security}
  PGUSER: ${POSTGRES_USER:-pnk_app}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
  DATABASE_URL: postgresql://db/${POSTGRES_DB:-pnk_security}
  DB_SSL: disable
services:
  db:
    # Imagen oficial estable. PostgreSQL se ejecuta exclusivamente en Docker.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pnk_security}
      POSTGRES_USER: ${POSTGRES_USER:-pnk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment: *app-environment
    command: ["node", "database/run.js", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
volumes:
  postgres_data:
